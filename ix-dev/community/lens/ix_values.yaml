images:
  mongo_image:
    repository: mongo
    tag: "8.2.2"
  backend:
    repository: amrit3701/lens
    tag: backend-latest
  frontend:
    repository: amrit3701/lens
    tag: frontend-latest
  fc_worker_api:
    repository: amrit3701/lens
    tag: fc-worker-api-latest
  fc_worker_celery:
    repository: amrit3701/lens
    tag: fc-worker-celery-latest
  redis:
    repository: redis
    tag: alpine
  container_utils_image:
    repository: ixsystems/container-utils
    tag: 1.0.2

consts:
  mongo_container_name: mongo
  db_user: lens
  db_name: lens

  backend_port: 3030
  frontend_port: 80

  backend_container_name: backend
  frontend_container_name: frontend
  fc_worker_redis_container_name: fc-worker-redis
  fc_worker_api_container_name: fc-worker-api
  fc_worker_celery_container_name: fc-worker-celery
  perms_container_name: permissions

  init_container_name: lens-init
  lens_uploads_path: /app/uploads
  init_uploads_path: /data
